[project]
name = "checkbox-detector"
version = "0.1.0"
description = "HTTP service that detects and classifies checkboxes in document images."
requires-python = ">=3.12"
# Dependencies: requirements.txt (runtime) and requirements-dev.txt (dev).
# This file only holds project metadata and tool config.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
