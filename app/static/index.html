<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkbox Detector</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #16191d; --muted: #5d6673; --line: #d9dee5;
    --accent: #1f4e9a; --ok: #2b8737; --no: #c4342d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1217; --card: #171c23; --text: #e6e9ee; --muted: #9aa4b2; --line: #2a313b; --accent: #86abeb; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px 64px; display: flex; flex-direction: column; gap: 20px; }
  h1 { margin: 0; font-size: 26px; }
  p { margin: 0; color: var(--muted); max-width: 65ch; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, label.upload { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 6px; padding: 8px 14px; cursor: pointer; }
  button:hover, label.upload:hover { border-color: var(--accent); }
  label.upload { background: var(--accent); color: #fff; border-color: var(--accent); }
  input[type=file] { display: none; }
  #status { font-variant-numeric: tabular-nums; }
  #status.error { color: var(--no); }
  .legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); }
  .legend i { display: inline-block; width: 12px; height: 12px; border: 3px solid; border-radius: 2px; vertical-align: -2px; margin-right: 6px; }
  canvas { width: 100%; height: auto; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
  details summary { cursor: pointer; color: var(--muted); }
  pre { margin: 8px 0 0; max-height: 320px; overflow: auto; font-size: 12px; background: var(--bg); padding: 10px; border-radius: 4px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <header class="row" style="justify-content: space-between">
    <h1>Checkbox Detector</h1>
    <a href="/docs">API docs</a>
  </header>
  <p>Upload a document image or try one of the samples from the challenge. Every detected checkbox is drawn on the image, and the JSON is what <code>POST /detect</code> returns.</p>

  <section class="panel">
    <div class="row">
      <label class="upload">Upload image<input id="file" type="file" accept="image/*"></label>
      <span style="color: var(--muted)">or try a sample:</span>
      <button data-sample="img-000.png">Sample 1</button>
      <button data-sample="img-001.png">Sample 2</button>
      <button data-sample="img-002.png">Sample 3</button>
      <button data-sample="img-003.png">Sample 4</button>
    </div>
    <div id="status">No image yet.</div>
  </section>

  <section class="panel" id="result" hidden>
    <div class="legend"><span><i style="border-color: #2b8737"></i>checked</span><span><i style="border-color: #d72828"></i>unchecked</span></div>
    <canvas id="canvas"></canvas>
    <details><summary>JSON response</summary><pre id="json"></pre></details>
  </section>
</main>

<script>
  const status = document.getElementById("status");
  const canvas = document.getElementById("canvas");

  function setStatus(text, isError = false) {
    status.textContent = text;
    status.className = isError ? "error" : "";
  }

  async function detect(blob, name) {
    setStatus(`Analyzing ${name}…`);
    const form = new FormData();
    form.append("file", blob, name);
    const start = performance.now();
    const response = await fetch("/detect", { method: "POST", body: form });
    const body = await response.json();
    if (!response.ok) {
      setStatus(`Error ${response.status}: ${body.detail?.[0]?.msg ?? body.detail}`, true);
      return;
    }
    const seconds = ((performance.now() - start) / 1000).toFixed(1);
    const checked = body.boxes.filter((b) => b.is_checked).length;
    setStatus(`${name}: ${body.boxes.length} checkboxes, ${checked} checked (${seconds} s)`);
    draw(blob, body.boxes);
    document.getElementById("json").textContent = JSON.stringify(body, null, 2);
    document.getElementById("result").hidden = false;
  }

  async function draw(blob, boxes) {
    const img = await createImageBitmap(blob);
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0);
    ctx.lineWidth = Math.max(2, img.width / 600);
    for (const { bbox: [x1, y1, x2, y2], is_checked } of boxes) {
      ctx.strokeStyle = is_checked ? "#2b8737" : "#d72828";
      ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
    }
  }

  document.getElementById("file").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (file) detect(file, file.name).catch((err) => setStatus(err.message, true));
  });

  document.querySelectorAll("[data-sample]").forEach((button) => {
    button.addEventListener("click", async () => {
      const name = button.dataset.sample;
      try {
        const blob = await (await fetch(`/samples/${name}`)).blob();
        await detect(blob, button.textContent);
      } catch (err) {
        setStatus(err.message, true);
      }
    });
  });
</script>
</body>
</html>
